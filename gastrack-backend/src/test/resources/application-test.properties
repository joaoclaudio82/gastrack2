# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (use JPA auto-create)
spring.flyway.enabled=false

# Security (for WebMvc tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/test

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.gastrack=DEBUG

# Job de sincronização desligado nos testes (auditoria #1).
gastrack.reading-sync.enabled=false
