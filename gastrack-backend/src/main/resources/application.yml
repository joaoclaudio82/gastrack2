server:
  http2:
    enabled: true

spring:
  datasource:
    # Default para desenvolvimento local usando Postgres do docker-compose.dev.yml (porta 5433)
    url: jdbc:postgresql://${POSTGRES_DB_SERVER_ADDRESS:localhost}:${POSTGRES_DB_SERVER_PORT:5433}/${POSTGRES_DB_NAME:appdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:example}
    hikari:
      pool-name: GasTrackHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  jta:
    enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

springdoc:
  show-actuator: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: ALWAYS
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

security:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
  require-https: ${REQUIRE_HTTPS:false}

logging:
  level:
    org.springframework: INFO
    com.gastrack: INFO
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

## AWS Cognito Configuration
aws:
  cognito:
    # Sem defaults reais em código: pool/client/secret vêm SEMPRE do ambiente.
    region: ${AWS_COGNITO_REGION:us-east-1}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
    domain: ${AWS_COGNITO_DOMAIN:}
  dynamodb:
    region: ${AWS_DYNAMODB_REGION:us-east-1}
    table-name: ${AWS_DYNAMODB_TABLE_NAME:pressure-monitoring-data-prod}
  iot:
    region: ${AWS_IOT_REGION:us-east-1}
    policy-name: ${AWS_IOT_POLICY_NAME:gastrack-esp-policy}

device:
  provisioning:
    api-key: ${DEVICE_API_KEY:change-me-in-production}

swagger:
  contact-name: GasTrack Team
  contact-mail: contato@gastrack.com.br
  contact-url: https://gastrack.com.br
  app-name: GasTrack Backend API
  app-description: "GasTrack - Sistema de monitoramento de cilindros de gás. Spring Boot 4.0.0, Spring Data JPA, Spring Security + AWS Cognito JWT, PostgreSQL, MapStruct, Lombok, Swagger (OpenAPI)"
  app-version: 4.0.0
  app-license-url: https://www.apache.org/licenses/LICENSE-2.0.html
  app-license: Apache 2.0

gastrack:
  # Thresholds de nível (% de enchimento). Fonte única: o frontend recebe estes
  # valores via API em vez de duplicar as constantes (auditoria #2).
  cylinder:
    thresholds:
      critical: ${GASTRACK_THRESHOLD_CRITICAL:20}
      low: ${GASTRACK_THRESHOLD_LOW:50}
      normal: ${GASTRACK_THRESHOLD_NORMAL:80}
  # Sincronização DynamoDB -> linha de gás (auditoria #1).
  reading-sync:
    enabled: ${READING_SYNC_ENABLED:true}
    interval-ms: ${READING_SYNC_INTERVAL_MS:60000}
