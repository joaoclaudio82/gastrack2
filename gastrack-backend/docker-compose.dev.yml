## Docker Compose - Postgres + API em containers (dev)
## Postgres no HOST na porta 5433 (evita conflito com Postgres local na 5432).
## Postgres no host:5433; mvn + profile dev: use DEV_LOCAL_DB_PORT=5433 se ligar a este compose
## Run: docker compose -f docker-compose.dev.yml up -d

name: gastrack-dev

services:

  postgres:
    container_name: gastrack-postgres-dev
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-devdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_NAME:-devdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: app-dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Fixture local disponivel ao Flyway; inerte enquanto SPRING_FLYWAY_LOCATIONS nao a incluir.
      - ./scripts/local:/fixture:ro
    environment:
      # SPRING_PROFILES_ACTIVE: dev  # Disabled to use Cognito + IoT security config
      POSTGRES_DB_SERVER_ADDRESS: postgres
      POSTGRES_DB_SERVER_PORT: 5432
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-devdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Para o container ja subir com a fixture, ponha no .env:
      #   SPRING_FLYWAY_LOCATIONS=classpath:db/migration,filesystem:/fixture
      SPRING_FLYWAY_LOCATIONS: ${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration}
    healthcheck:
      test: "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
