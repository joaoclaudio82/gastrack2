name: Validate Code

on: workflow_call

permissions:
  contents: read

jobs:
  called-workflow:
    name: Lint, unit tests & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run ci:all
      - run: bun run e2e
